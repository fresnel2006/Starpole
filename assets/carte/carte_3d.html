<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Carte StarPole</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9edf1; font-family: sans-serif; }
  #carte { position: absolute; inset: 0; }

  /* La mention Mapbox reste visible au-dessus de la fiche du bas. */
  .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right { bottom: var(--bas, 0px); }

  /* Un repère d'alerte : une épingle de la couleur du type d'alerte. */
  .pin { position: relative; width: 38px; height: 46px; cursor: pointer;
         transform-origin: 50% 100%; transition: transform .25s ease; }
  .pin svg { width: 100%; height: 100%; display: block;
             filter: drop-shadow(0 4px 3px rgba(0, 0, 0, .35)); }
  .pin.choisi { transform: scale(1.35); }
  /* Les urgences émettent un cercle qui pulse autour de l'épingle. */
  .pin.urgence::before { content: ''; position: absolute; left: 50%; bottom: -6px;
         width: 22px; height: 22px; margin-left: -11px; border-radius: 50%;
         background: currentColor; opacity: .4; animation: pouls 1.8s ease-out infinite; }
  @keyframes pouls { 0% { transform: scale(.5); opacity: .55; } 100% { transform: scale(3.2); opacity: 0; } }

  /* Ma position : un point bleu qui rayonne. */
  .moi { width: 20px; height: 20px; border-radius: 50%; background: #1a73e8;
         border: 3px solid #fff; box-sizing: border-box;
         animation: rayon 2s ease-out infinite; }
  @keyframes rayon { 0% { box-shadow: 0 0 0 0 rgba(26, 115, 232, .55); } 100% { box-shadow: 0 0 0 24px rgba(26, 115, 232, 0); } }
</style>
</head>
<body>
<div id="carte"></div>
<script>
  mapboxgl.accessToken = '__JETON__';

  // Les messages vers l'application (canal « Carte » de Flutter).
  function envoyer(objet) {
    if (window.Carte && window.Carte.postMessage) window.Carte.postMessage(JSON.stringify(objet));
  }

  var CENTRE_PAR_DEFAUT = [-4.0167, 5.3197]; // le Plateau, à Abidjan
  var carte = new mapboxgl.Map({
    container: 'carte',
    style: 'mapbox://styles/mapbox/standard',
    center: CENTRE_PAR_DEFAUT,
    zoom: 15.8,
    pitch: 62,
    bearing: -18,
    antialias: true,
    language: 'fr',
    attributionControl: false
  });
  carte.addControl(new mapboxgl.AttributionControl({ compact: true }), 'bottom-left');

  var pret = false, donnees = null, premiere = true, choisieAffichee = null;
  var reperes = {}, repereMoi = null;

  // Le style « Standard » de Mapbox : bâtiments, monuments et lumière en 3D.
  carte.on('style.load', function () {
    try {
      carte.setConfigProperty('basemap', 'lightPreset', 'day');
      carte.setConfigProperty('basemap', 'show3dObjects', true);
      carte.setConfigProperty('basemap', 'showPointOfInterestLabels', true);
    } catch (e) { /* le style n'a pas ces réglages : on garde les valeurs par défaut */ }
  });
  carte.on('load', function () {
    pret = true;
    envoyer({ type: 'pret' });
    if (donnees) appliquer(donnees);
  });
  carte.on('error', function (e) {
    var message = (e && e.error && e.error.message) ? e.error.message : String(e);
    envoyer({ type: 'erreur', message: message });
  });

  function creerRepere(a) {
    var conteneur = document.createElement('div'); // celui que Mapbox déplace
    var pin = document.createElement('div');
    pin.className = 'pin';
    pin.innerHTML = '<svg viewBox="0 0 38 46"><path d="M19 1C9.6 1 2 8.4 2 17.6 2 30 19 45 19 45s17-15 17-27.4C36 8.4 28.4 1 19 1z" fill="currentColor" stroke="#fff" stroke-width="2.5"/><circle cx="19" cy="17" r="6.5" fill="#fff"/></svg>';
    conteneur.appendChild(pin);
    pin.addEventListener('click', function (ev) {
      ev.stopPropagation();
      envoyer({ type: 'alerte', id: a.id });
    });
    var marqueur = new mapboxgl.Marker({ element: conteneur, anchor: 'bottom', pitchAlignment: 'viewport', rotationAlignment: 'viewport' })
      .setLngLat([a.lng, a.lat]).addTo(carte);
    return { marqueur: marqueur, conteneur: conteneur, pin: pin };
  }

  function majRepere(r, a) {
    r.pin.style.color = a.couleur;
    r.pin.classList.toggle('choisi', !!a.choisie);
    r.pin.classList.toggle('urgence', !!a.urgence);
    r.conteneur.style.zIndex = a.choisie ? 5 : 1;
    r.marqueur.setLngLat([a.lng, a.lat]);
  }

  function appliquer(d) {
    document.documentElement.style.setProperty('--bas', (d.bas || 0) + 'px');
    carte.setPadding({ top: d.haut || 0, bottom: d.bas || 0, left: 0, right: 0 });

    // Les alertes : ajoutées, mises à jour ou retirées.
    var vus = {};
    d.alertes.forEach(function (a) {
      vus[a.id] = true;
      if (!reperes[a.id]) reperes[a.id] = creerRepere(a);
      majRepere(reperes[a.id], a);
    });
    Object.keys(reperes).forEach(function (id) {
      if (!vus[id]) { reperes[id].marqueur.remove(); delete reperes[id]; }
    });

    // Ma position.
    if (d.moi) {
      if (!repereMoi) {
        var point = document.createElement('div');
        point.className = 'moi';
        repereMoi = new mapboxgl.Marker({ element: point }).setLngLat([d.moi.lng, d.moi.lat]).addTo(carte);
      } else {
        repereMoi.setLngLat([d.moi.lng, d.moi.lat]);
      }
    } else if (repereMoi) {
      repereMoi.remove(); repereMoi = null;
    }

    // Au premier affichage : on se place sur moi, sinon sur l'alerte choisie.
    // Ensuite, on ne bouge que lorsque l'alerte choisie change.
    var choisie = null;
    d.alertes.forEach(function (a) { if (a.choisie) choisie = a; });
    if (premiere) {
      premiere = false;
      var cible = d.moi || (choisie ? { lng: choisie.lng, lat: choisie.lat } : null);
      if (cible) carte.jumpTo({ center: [cible.lng, cible.lat] });
      choisieAffichee = choisie ? choisie.id : null;
    } else if (choisie && choisie.id !== choisieAffichee) {
      choisieAffichee = choisie.id;
      carte.flyTo({ center: [choisie.lng, choisie.lat], zoom: Math.max(carte.getZoom(), 16.5), speed: 1.3, essential: true });
    } else if (!choisie) {
      choisieAffichee = null;
    }
  }

  // Appelée par l'application avec les alertes et ma position.
  function miseAJour(d) {
    donnees = d;
    if (pret) appliquer(d);
  }
</script>
</body>
</html>
